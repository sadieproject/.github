name: Mark stale issues and pull requests
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@997185467fa4f803885201cee163a9f38240193d
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/stale.yml
